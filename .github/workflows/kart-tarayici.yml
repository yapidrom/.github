name: Kart tarayıcı

# ─────────────────────────────────────────────────────────────────────────────
# Kart durumunu bütün org için tek yerden taşır (CTO, 2026-10-28). Repo başına çağırıcı gerekmez,
# yeni repolar kendiliğinden kapsanır. Maliyet sabit: hafta içi 09:00–18:00 TR saatte bir (~220 dk/ay).
#
# Her turda, son turdan bu yana (pazartesi ilk turda cuma akşamından bu yana):
#   1. Dal → In Progress: bu pencerede push almış (dal açmak dahil) repolarda adında kart numarası olan dal
#      (`feature/264-…`, `fix/301-…`, GitHub'ın `264-…` adı) varsa aynı repodaki kart **aktif sprint'teyse** ve
#      Todo'daysa (ya da Status boşsa) In Progress'e çekilir. Commit'siz yeni dal açıldığı saatin turunda yakalanır.
#      Sprint dışı kart taşınmaz.
#   2. Merge → In Test: `dev`'e merge olmuş PR'ın gövdesindeki kartlar (`Refs #N`, `Closes #N`, başka repo için
#      `Refs yapidrom/<repo>#N`) In Test'ten gerideyse (Todo, In Progress, Pending, Pending Reply, Ready for Test,
#      boş) In Test'e taşınır. Zaten In Test ya da sonrasındaysa dokunulmaz.
#   3. PR kontrolleri: son turdan beri değişmiş, dev'e açık PR'larda sahiplenme kutuları, `Refs #N`, `Closes` uyarısı,
#      kartın durumu. Sorun varsa PR'a tek yorum (güncellenir) ve `kontrol-eksik` etiketi; kutular boşken review'a
#      açılmış PR taslağa çekilir. Repo başına issue-link-check pilotunun yerine, bütün org için (CTO 2026-10-28).
# Yalnız ileri taşır, geri almaz; personelin elle taşıması serbesttir (kural §3: geçiş insanın; tarayıcı yedek).
# Muaf PR: başlık "chore: bump … ref", "docs:"; `deploy` etiketi (issue-link-check ile aynı).
# Kart Tazı V2 (proje 2) panosunda değilse ya da issue kapalıysa atlanır.
#
# Elle: `deneme: true` yalnız rapor yazar, karta dokunmaz; `saat` geriye bakılacak saat (varsayılan otomatik).
# Kimlik: `tazi-ci` GitHub uygulaması (kişiye bağlı değil; CTO 2026-10-28). Repo secret'ları TAZI_CI_APP_ID ve
# TAZI_CI_KEY (yalnız bu repoda). Uygulama izinleri: Projects (org) yazma, Issues okuma, Contents ve Pull requests.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 6-15 * * 1-5'   # UTC = 09:00–18:00 TR, pazartesi–cuma (CTO 2026-10-28; uçtan uca denendi, .github#11)
  workflow_dispatch:
    inputs:
      deneme:
        description: 'Yalnız rapor (karta dokunma)'
        type: boolean
        default: true
      saat:
        description: 'Geriye bakılacak saat (boş = otomatik)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: kart-tarayici
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TAZI_CI_APP_ID }}
          private-key: ${{ secrets.TAZI_CI_KEY }}
          owner: yapidrom
      - uses: actions/github-script@v7
        env:
          DENEME: ${{ github.event_name == 'workflow_dispatch' && inputs.deneme || false }}
          PR_KONTROL_YAZ: ${{ vars.PR_KONTROL_YAZ }}
          SAAT: ${{ github.event_name == 'workflow_dispatch' && inputs.saat || '' }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const org = 'yapidrom', projeNo = 2;
            const deneme = String(process.env.DENEME) === 'true';
            const simdi = new Date();
            // Geriye bakış: son turdan bu yana + 10 dk pay. Pazartesi ilk tur (06 UTC) cuma 15 UTC'den beri.
            let saat = Number(process.env.SAAT || 0);
            if (!saat) saat = (simdi.getUTCDay() === 1 && simdi.getUTCHours() <= 6) ? 64 : 1;
            const since = new Date(simdi.getTime() - (saat * 60 + 10) * 60000);
            const sinceIso = since.toISOString().replace(/\.\d+Z$/, 'Z');
            core.info(`Geriye bakış: ${saat} saat (${sinceIso}'den beri)${deneme ? ' — DENEME' : ''}`);

            const gql = (q, v) => github.graphql(q, v);
            const proje = (await gql(`query($o:String!,$n:Int!){ organization(login:$o){ projectV2(number:$n){ id
              status: field(name:"Status"){ ... on ProjectV2SingleSelectField{ id options{ id name } } } } } }`,
              { o: org, n: projeNo })).organization.projectV2;
            const secenek = Object.fromEntries(proje.status.options.map(o => [o.name, o.id]));
            const kartOku = async (repo, no) => {
              const d = await gql(`query($o:String!,$r:String!,$n:Int!){ repository(owner:$o,name:$r){ issue(number:$n){ state
                projectItems(first:10){ nodes{ id project{ number }
                  status: fieldValueByName(name:"Status"){ ... on ProjectV2ItemFieldSingleSelectValue{ name } }
                  sprint: fieldValueByName(name:"Sprint"){ ... on ProjectV2ItemFieldIterationValue{ title } } } } } } }`,
                { o: org, r: repo, n: no }).catch(() => null);
              const is = d && d.repository && d.repository.issue;
              if (!is || is.state !== 'OPEN') return null;
              const it = is.projectItems.nodes.find(x => x.project.number === projeNo);
              return it ? { id: it.id, status: it.status ? it.status.name : '', sprint: it.sprint ? it.sprint.title : null } : null;
            };
            const tasi = (itemId, hedef) => gql(`mutation($p:ID!,$i:ID!,$f:ID!,$v:String!){
              updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$v}}){ projectV2Item{ id } } }`,
              { p: proje.id, i: itemId, f: proje.status.id, v: secenek[hedef] });
            const rapor = [];
            const islendi = new Set();

            // ── 1. Dal → In Progress ────────────────────────────────────────────
            // Bu pencerede push almış repolar (dal açmak da repo'nun pushed_at'ini günceller; 2026-10-28'de denendi) ve
            // onlardaki bütün numaralı dallar. Commit saatine bakılmaz: commit'siz yeni dal açıldığı saatin turunda
            // yakalanır. Repo olay akışı kullanılmaz: dakikalarca, bazen saatlerce gecikiyor. Yalnız aktif sprint'teki
            // Todo kart taşınır; sprint dışı kart taşınmaz. Sınır: aynı repodaki eski bir numaralı dalın kartı bu sprint
            // planlanıp Todo'daysa o da In Progress'e geçer (kartın dalı var).
            const iter = (await gql(`query($o:String!,$n:Int!){ organization(login:$o){ projectV2(number:$n){
              field(name:"Sprint"){ ... on ProjectV2IterationField{ configuration{ iterations{ title startDate duration } } } } } } }`,
              { o: org, n: projeNo })).organization.projectV2.field.configuration.iterations
              .find(x => { const b = new Date(x.startDate + 'T00:00:00Z'); return b <= simdi && simdi < new Date(b.getTime() + x.duration * 86400000); });
            const aktifSprint = iter ? iter.title : null;
            core.info(`Aktif sprint: ${aktifSprint || 'yok'}`);
            const repolar = await github.paginate(github.rest.search.repos,
              { q: `org:${org} pushed:>=${sinceIso} archived:false`, per_page: 100 });
            for (const r of (aktifSprint ? repolar : [])) {
              const dallar = (await github.paginate(github.rest.repos.listBranches, { owner: org, repo: r.name, per_page: 100 })
                .catch(() => [])).map(x => x.name);
              for (const dal of dallar) {
                const b = { name: dal };
                const m = b.name.match(/^(?:[A-Za-z]+\/)?(\d+)-/);
                if (!m) continue;
                const anahtar = `${r.name}#${m[1]}`;
                if (islendi.has(anahtar)) continue; islendi.add(anahtar);
                const k = await kartOku(r.name, Number(m[1]));
                if (!k || (k.status && k.status !== 'Todo') || k.sprint !== aktifSprint) continue;
                if (!deneme) await tasi(k.id, 'In Progress');
                rapor.push(`${anahtar}: ${k.status || '(boş)'} → In Progress (dal ${b.name})`);
              }
            }

            // ── 2. Merge → In Test ──────────────────────────────────────────────
            const geride = ['', 'Todo', 'In Progress', 'Pending', 'Pending Reply', 'Ready for Test'];
            const hedefTest = secenek['In Test'] ? 'In Test' : 'Ready for Test';
            const prler = await github.paginate(github.rest.search.issuesAndPullRequests,
              { q: `org:${org} is:pr is:merged base:dev merged:>=${sinceIso}`, per_page: 100 });
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs?)\b\s*:?\s+(?:([\w.-]+)\/([\w.-]+))?#(\d+)/gi;
            for (const p of prler) {
              const repo = p.repository_url.split('/').pop();
              const baslik = p.title || '';
              const etiket = (p.labels || []).map(l => l.name);
              if (/^chore(\([^)]*\))?:\s*bump\b.*\bref\b/i.test(baslik) || /^docs(\([^)]*\))?:/i.test(baslik) || etiket.includes('deploy')) continue;
              for (const m of `${baslik}\n\n${p.body || ''}`.matchAll(re)) {
                const r2 = m[2] || repo, no = Number(m[3]);
                if (r2 === repo && no === p.number) continue;
                const anahtar = `${r2}#${no}`;
                const k = await kartOku(r2, no);
                if (!k || !geride.includes(k.status)) continue;
                if (!deneme) await tasi(k.id, hedefTest);
                rapor.push(`${anahtar}: ${k.status || '(boş)'} → ${hedefTest} (PR ${repo}#${p.number} merge)`);
              }
            }

            // ── 3. PR kontrolleri (CTO 2026-10-28; issue-link-check pilotunun yerine, bütün org) ──────────
            // Son turdan beri değişmiş, dev'e açık PR'lar. Kurallar: sahiplenme kutuları (calisma-kurallari §4),
            // `Refs #N` kart bağı (K41 a), mekanik olmayan PR'da `Closes` uyarısı (K41 a), kart panoda/sprint'te/Pending
            // değil/açık (§3). Sorun varsa PR'a tek yorum (her turda aynı yorum güncellenir) ve `kontrol-eksik` etiketi;
            // sorun kalmayınca yorum "tamam"a döner, etiket kalkar. Kutular boşken taslak değilse PR taslağa çekilir.
            // Muaf: ref bump, `docs:`, `deploy` etiketi; sahiplenme kontrolünden ayrıca CTO ve botlar.
            const isaret = '<!-- kart-tarayici-pr -->';
            const kartDurum = async (repo, no) => {
              const d = await gql(`query($o:String!,$r:String!,$n:Int!){ repository(owner:$o,name:$r){ issue(number:$n){ state
                projectItems(first:10){ nodes{ project{ number }
                  status: fieldValueByName(name:"Status"){ ... on ProjectV2ItemFieldSingleSelectValue{ name } }
                  sprint: fieldValueByName(name:"Sprint"){ ... on ProjectV2ItemFieldIterationValue{ title } } } } } } }`,
                { o: org, r: repo, n: no }).catch(() => null);
              const is = d && d.repository && d.repository.issue;
              if (!is) return `${repo}#${no}: issue bulunamadı.`;
              if (is.state !== 'OPEN') return `${repo}#${no}: kapalı. Kapanmış işe PR gelmez; yeni kart aç.`;
              const it = is.projectItems.nodes.find(x => x.project.number === projeNo);
              // Kendi panosunda planlanan iş (ör. Bisiklet Taksi #15): kart orada bir sprint'teyse sorun değil.
              if (!it) return is.projectItems.nodes.some(x => x.sprint) ? null : `${repo}#${no}: Tazı V2 panosunda değil.`;
              const st = it.status ? it.status.name : '';
              if (!it.sprint) return `${repo}#${no}: sprint'e alınmamış. Planlanmamış işe PR açılmaz; Sprint alanını PM ya da CTO değiştirir (K53).`;
              if (['Pending', 'Pending Reply'].includes(st)) return `${repo}#${no}: ${st} — karar ya da cevap bekleyen işe kod yazılmaz, önce blokaj çözülür.`;
              if (st === 'Done') return `${repo}#${no}: Done. Kapanmış işe PR gelmez.`;
              return null;
            };
            const acikPrler = await github.paginate(github.rest.search.issuesAndPullRequests,
              { q: `org:${org} is:pr is:open base:dev updated:>=${sinceIso}`, per_page: 100 });
            const prRapor = [];
            // PR'lara yazma yalnız repo değişkeni PR_KONTROL_YAZ = "true" iken (CTO onayı); değilse yalnız rapor.
            const prYaz = !deneme && String(process.env.PR_KONTROL_YAZ) === 'true';
            for (const p0 of acikPrler) {
              const repo = p0.repository_url.split('/').pop();
              const pr = (await github.rest.pulls.get({ owner: org, repo, pull_number: p0.number })).data;
              const baslik = pr.title || '', etiket = (pr.labels || []).map(l => l.name);
              const yazar = (pr.user && pr.user.login) || '';
              // Muaf: ref bump ve gateway alt servis güncellemesi (`chore(x): gitlink bump`, `chore: bump … ref`), `docs:`,
              // `deploy` etiketi; CTO'nun PR'ı tamamen (kendi PR'ını review'sız merge eder; CTO 2026-10-28).
              if (/^chore(\([^)]*\))?:.*\b(bump|gitlink)\b/i.test(baslik) || /^docs(\([^)]*\))?:/i.test(baslik)
                  || etiket.includes('deploy') || yazar === 'demiryasinoruc') continue;
              const bot = (pr.user && pr.user.type === 'Bot') || /\[bot\]$/.test(yazar);
              const govde = (pr.body || '').replace(/\r/g, '');
              const sorun = [], uyari = [];
              // Sahiplenme kutuları
              let kutuBos = false;
              if (yazar !== 'demiryasinoruc' && !bot) {
                const bolum = govde.match(/^##\s*Sahiplenme\s*$([\s\S]*?)(?=^##\s|^Refs\b|(?![\s\S]))/mi);
                if (!bolum) { sorun.push('Gövdede `## Sahiplenme` bölümü yok — gövdeyi `tz-core:pr-write` ile yaz.'); kutuBos = true; }
                else {
                  const bos = (bolum[1].match(/^\s*[-*]\s*\[ \]/gm) || []).length, dolu = (bolum[1].match(/^\s*[-*]\s*\[[xX]\]/gm) || []).length;
                  if (bos + dolu === 0) { sorun.push('`## Sahiplenme` bölümünde kutu yok.'); kutuBos = true; }
                  else if (bos > 0) { sorun.push(`${bos} sahiplenme kutusu boş — PR sayfasında işaretle (tıklaman yeterli).`); kutuBos = true; }
                }
              }
              // Kart bağı ve durumu
              const refs = [...`${baslik}\n\n${govde}`.matchAll(re)]
                .map(m => ({ r: m[2] || repo, n: Number(m[3]) })).filter(x => !(x.r === repo && x.n === pr.number));
              if (!refs.length) sorun.push('Gövdede `Refs #N` yok — bu PR hangi kartın işi? Kart yoksa önce kart açılır.');
              if (/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b\s*:?\s+(?:[\w.-]+\/[\w.-]+)?#\d+/i.test(govde))
                uyari.push('Kart `Closes`/`Fixes` ile bağlanmış: merge anında kart Done olur, test ve UAT atlanır. Mekanik PR değilse `Refs #N` yaz (K41 a).');
              const goruldu = new Set();
              for (const x of refs) { const a = `${x.r}#${x.n}`; if (goruldu.has(a)) continue; goruldu.add(a);
                const s2 = await kartDurum(x.r, x.n); if (s2) sorun.push(s2); }
              // Yorum, etiket, taslak
              const yorumlar = await github.paginate(github.rest.issues.listComments, { owner: org, repo, issue_number: pr.number, per_page: 100 });
              const eski = yorumlar.find(c => (c.body || '').includes(isaret));
              const etiketVar = etiket.includes('kontrol-eksik');
              const taslagaCek = kutuBos && !pr.draft;
              if (sorun.length || uyari.length) {
                const metin = `${isaret}\n🔎 **PR kontrolü** (kart tarayıcı, saat başı)\n\n` +
                  (sorun.length ? sorun.map(s => `- ⛔ ${s}`).join('\n') + '\n' : '') +
                  (uyari.length ? uyari.map(s => `- ⚠️ ${s}`).join('\n') + '\n' : '') +
                  (taslagaCek ? '\nKutular boşken review istendiği için PR taslağa geri çekildi. Kutuları işaretleyip yeniden **Ready for review** de.\n' : '') +
                  '\nKurallar: `tazi-docs-management/planning/calisma-kurallari.md` §3–§4, `surec-kararlari.md` K41. Düzeltince bir sonraki turda bu yorum güncellenir.';
                prRapor.push(`${repo}#${pr.number}: ${sorun.length} sorun, ${uyari.length} uyarı${taslagaCek ? ', taslağa çekilecek' : ''}`);
                if (prYaz) {
                  if (eski) { if (eski.body !== metin) await github.rest.issues.updateComment({ owner: org, repo, comment_id: eski.id, body: metin }); }
                  else await github.rest.issues.createComment({ owner: org, repo, issue_number: pr.number, body: metin });
                  if (sorun.length && !etiketVar) await github.rest.issues.addLabels({ owner: org, repo, issue_number: pr.number, labels: ['kontrol-eksik'] });
                  if (!sorun.length && etiketVar) await github.rest.issues.removeLabel({ owner: org, repo, issue_number: pr.number, name: 'kontrol-eksik' }).catch(() => {});
                  if (taslagaCek) await gql('mutation($id:ID!){ convertPullRequestToDraft(input:{pullRequestId:$id}){ pullRequest{ isDraft } } }', { id: pr.node_id });
                }
              } else if (eski || etiketVar) {
                prRapor.push(`${repo}#${pr.number}: düzeldi`);
                if (prYaz) {
                  if (eski) await github.rest.issues.updateComment({ owner: org, repo, comment_id: eski.id, body: `${isaret}\n✅ **PR kontrolü** — süreç kontrolleri tamam (kart tarayıcı).` });
                  if (etiketVar) await github.rest.issues.removeLabel({ owner: org, repo, issue_number: pr.number, name: 'kontrol-eksik' }).catch(() => {});
                }
              }
            }
            rapor.push(...prRapor.map(s => `PR kontrolü${prYaz ? '' : ' (yalnız rapor)'} — ${s}`));

            const ozet = rapor.length ? rapor.map(s => `- ${s}`).join('\n') : 'Taşınacak kart yok.';
            await core.summary.addRaw(`Geriye bakış ${saat} saat${deneme ? ' (deneme, karta dokunulmadı)' : ''}\n\n${ozet}\n`).write();
            core.info(ozet);
