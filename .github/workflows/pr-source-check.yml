name: PR Source Branch Check

on:
  pull_request:
    branches: [master, main, dev]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Validate PR source branch
        id: check
        run: |
          SOURCE="${{ github.head_ref }}"
          TARGET="${{ github.base_ref }}"

          echo "Source branch: $SOURCE"
          echo "Target branch: $TARGET"
          echo ""

          # Master branch rules
          if [[ "$TARGET" == "master" ]] || [[ "$TARGET" == "main" ]]; then
            if [[ "$SOURCE" == "dev" ]] || [[ "$SOURCE" =~ ^hotfix/ ]]; then
              echo "✅ Valid: $SOURCE → $TARGET"
              echo "valid=true" >> $GITHUB_OUTPUT
            else
              echo "❌ Invalid source branch: $SOURCE"
              echo ""
              echo "Master only accepts PRs from:"
              echo "  - dev (for releases)"
              echo "  - hotfix/* (for urgent fixes)"
              echo "valid=false" >> $GITHUB_OUTPUT
              echo "target=master" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          # Dev branch rules
          if [[ "$TARGET" == "dev" ]]; then
            if [[ "$SOURCE" =~ ^(feature|bugfix|refactor|chore|test)/ ]]; then
              echo "✅ Valid: $SOURCE → $TARGET"
              echo "valid=true" >> $GITHUB_OUTPUT
            else
              echo "❌ Invalid source branch: $SOURCE"
              echo ""
              echo "Dev only accepts PRs from:"
              echo "  - feature/*"
              echo "  - bugfix/*"
              echo "  - refactor/*"
              echo "  - chore/*"
              echo "  - test/*"
              echo "valid=false" >> $GITHUB_OUTPUT
              echo "target=dev" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          echo "⚠️ Unknown target branch: $TARGET"
          echo "valid=true" >> $GITHUB_OUTPUT

      - name: Close invalid PR
        if: steps.check.outputs.valid == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const target = '${{ steps.check.outputs.target }}';
            const source = '${{ github.head_ref }}';

            let message = '';
            if (target === 'master') {
              message = `⛔ **PR Otomatik Kapatıldı**

            Bu branch (\`${source}\`) master'a doğrudan merge edilemez.

            **İzin verilen kaynaklar:**
            - \`dev\` (release için)
            - \`hotfix/*\` (acil düzeltmeler için)

            Lütfen önce \`dev\` branch'ine PR açın.`;
            } else if (target === 'dev') {
              message = `⛔ **PR Otomatik Kapatıldı**

            Bu branch (\`${source}\`) dev'e merge edilemez.

            **İzin verilen kaynaklar:**
            - \`feature/*\` (yeni özellikler)
            - \`bugfix/*\` (bug düzeltmeleri)
            - \`refactor/*\` (refactoring)
            - \`chore/*\` (bakım işleri)
            - \`test/*\` (test branch'leri)

            Lütfen branch adınızı uygun formata çevirin.`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed'
            });

      - name: Fail if invalid
        if: steps.check.outputs.valid == 'false'
        run: |
          echo "PR closed due to invalid source branch"
          exit 1
